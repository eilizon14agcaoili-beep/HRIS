<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM Dashboard · Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d24;--p:#0e1838;--p2:#142049;--ln:#1f2d5c;--tx:#eaf0ff;--mu:#8794c4;--bl:#4f8cff;--cy:#38d4ff;--gr:#35d8a4;--am:#ffb547;--rd:#ff6b81}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#13286a 0%,transparent 60%),var(--bg);color:var(--tx);font:14px/1.45 Manrope,'Segoe UI',system-ui,sans-serif;display:flex;min-height:100vh}
button,select,input{font:inherit;color:var(--tx)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
a{color:inherit;text-decoration:none}
aside{display:flex;flex-direction:column;width:252px;flex-shrink:0;background:var(--p);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;font-weight:800;font-size:16px}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--bl),var(--cy));display:grid;place-items:center;font-style:normal;color:#04112e}
.nv{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border:0;background:none;border-radius:9px;color:var(--mu);cursor:pointer;text-align:left;font-weight:600}
.nv:hover,.nv.on{background:var(--p2);color:var(--tx)}
.nv.on{box-shadow:inset 3px 0 0 var(--cy)}
.sub{display:none;margin:2px 0 6px 14px;border-left:1px solid var(--ln);padding-left:6px}
.grp.open .sub{display:block}.grp.open>.nv .ch{transform:rotate(90deg)}
.ch{transition:transform .2s;font-size:11px}
main{flex:1;min-width:0;padding:22px 28px 40px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.top small{display:block;color:var(--mu);font-weight:500;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search],.btn{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.btn{cursor:pointer;font-weight:600}.btn:hover{border-color:var(--bl)}
.btn.pri{background:var(--bl);border-color:var(--bl);color:#04112e}
.chk{display:flex;gap:6px;align-items:center;color:var(--mu);font-weight:600;cursor:pointer}
#burger{display:none}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:14px;padding:18px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--mu);display:flex;justify-content:space-between;align-items:center;gap:8px}
.g{display:grid;gap:14px;margin-bottom:14px}
.hero{grid-template-columns:260px 1fr}.kp{grid-template-columns:repeat(4,1fr);gap:14px;display:grid}
.c21{grid-template-columns:2fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c11{grid-template-columns:1fr 1fr}
.n{font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dl{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px;margin-top:6px}
.up{background:rgba(53,216,164,.14);color:var(--gr)}.dn{background:rgba(255,107,129,.14);color:var(--rd)}.nu{background:var(--p2);color:var(--mu)}
.ring{display:grid;place-items:center;position:relative}
.ring b{position:absolute;font-size:30px;font-weight:800}.ring em{position:absolute;margin-top:46px;font-style:normal;color:var(--mu);font-size:12px}
.ch-box{position:relative;height:280px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:700;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}
td.r,th.r{text-align:right}tr:hover td{background:rgba(79,140,255,.06)}
.mt{height:6px;background:var(--p2);border-radius:4px;min-width:90px;overflow:hidden}.mt i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--cy));border-radius:4px}
.tab{display:flex;gap:4px;background:var(--p);border:1px solid var(--ln);border-radius:9px;padding:3px}
.tab button{border:0;background:none;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--mu);font-weight:600}.tab button.on{background:var(--bl);color:#04112e}
.mini div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}.mini div:last-child{border:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:12px}
.cal .h{text-align:center;color:var(--mu);font-weight:700}
.cal .d{min-height:58px;border-radius:8px;background:var(--p);padding:5px 7px;border:1px solid transparent}
.cal .d b{color:var(--mu);font-weight:600}.cal .ok{color:var(--gr)}.cal .lt{color:var(--rd);font-weight:700}
.sk{background:linear-gradient(90deg,var(--p2) 25%,var(--ln) 50%,var(--p2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;min-height:110px;margin-bottom:14px}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;padding:60px 20px;color:var(--mu)}.msg h2{color:var(--tx)}
.pill{background:rgba(255,181,71,.15);color:var(--am);border-radius:20px;padding:3px 10px;font-weight:700;font-size:12px}
@media(max-width:1100px){.hero,.c21,.c3,.c11{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}}
@media(max-width:860px){aside{position:fixed;z-index:20;transform:translateX(-100%)}aside.show{transform:none}#burger{display:inline-block}main{padding:16px}}
@media print{aside,.tools{display:none}body{background:#fff;color:#000}.card{background:#fff;border-color:#ccc}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside id="side"><div class="brand"><i>G</i>GM Dashboard</div><nav id="nav" style="flex:1"></nav>
  <div style="padding:14px 8px 4px;border-top:1px solid var(--ln)"><div id="userName" style="font-weight:700;word-break:break-all"></div><span id="welcomeName" hidden></span>
    <a href="/manager/" class="nv" style="margin-top:6px">← Back to manager</a><button class="btn" id="logoutBtn" style="margin-top:6px;width:100%">Log out</button></div></aside>
<main>
  <div class="top">
    <div><button class="btn" id="burger" aria-label="Menu">☰</button>
      <h1 id="ttl">Overview</h1><small id="sub"></small></div>
    <div class="tools">
      <select id="fCo" aria-label="Company"><option value="all">All companies</option><option>Prestige</option><option>Regcris</option><option>Tmarks</option><option>CoMerch</option></select>
      <select id="fYr" aria-label="Year"></select><select id="fMo" aria-label="Month"><option value="">All months</option></select>
      <label class="chk"><input type="checkbox" id="fCmp" checked> Compare</label>
      <button class="btn" id="bCsv">Export CSV</button><button class="btn" id="bPrt">Print</button><button class="btn pri" id="bRef">Refresh</button>
    </div>
  </div>
  <div id="view"><div class="sk"></div><div class="sk" style="min-height:300px"></div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
import { guard, auth } from "../shared/guard.js";
import { API_URL } from "../shared/firebase-config.js";
// ---------- CONFIG ----------
const API_BASE = API_URL.replace(/\/+$/, '');
const DEMO = new URLSearchParams(location.search).has('demo');   // /gm/?demo previews the design with sample data
const getToken = () => auth.currentUser.getIdToken();            // Firebase ID token for requireAuth

// ---------- NAV / VIEWS ----------
const V = {
  overview:{t:'Overview'},
  payroll:{t:'Per payroll period',k:'perPayroll',trend:1,l:'Payroll period'}, month:{t:'Per month',k:'perMonth',trend:1,l:'Month'}, year:{t:'Per year',k:'perYear',trend:1,l:'Year'},
  company:{t:'Per company',k:'perCompany',l:'Company',ty:'doughnut'}, client:{t:'Client / principal',k:'perClient',l:'Client'},
  region:{t:'Region',k:'perRegion',l:'Region'}, province:{t:'Province',k:'perProvince',l:'Province'}, city:{t:'City / municipality',k:'perCity',l:'City / municipality'},
  position:{t:'Position',k:'perPosition',l:'Position'}, gender:{t:'Gender',k:'perGender',l:'Gender',ty:'doughnut'}, age:{t:'Age range',k:'perAge',l:'Age range',ty:'bar',vert:1},
  compliance:{t:'Submission compliance'}
};
const NAV = [['overview'],['Total submission',['payroll','month','year']],['Company & client',['company','client']],['Location',['region','province','city']],['People',['position','gender','age']],['compliance']];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PAL = ['#4f8cff','#38d4ff','#35d8a4','#ffb547','#ff6b81','#a98bff','#7be0ff','#ffd27a'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { data:null, prev:null, q:'', sort:['count',-1], lim:15, ct:null, err:null, at:null };
const charts = {};

Chart.defaults.color = '#8794c4'; Chart.defaults.borderColor = '#1f2d5c'; Chart.defaults.font.family = 'Manrope';
Chart.register({ id:'ctr', afterDraw(c){ if(c.config.type!=='doughnut') return; const a=c.chartArea,x=c.ctx,t=c.config.data.datasets[0].data.reduce((p,q)=>p+q,0),mx=(a.left+a.right)/2,my=(a.top+a.bottom)/2;
  x.save();x.textAlign='center';x.fillStyle='#eaf0ff';x.font='800 24px Manrope';x.fillText(t,mx,my+4);x.fillStyle='#8794c4';x.font='500 11px Manrope';x.fillText('total',mx,my+20);x.restore(); }});
const draw = (id,cfg) => { charts[id]?.destroy(); const el=$(id); if(el) charts[id]=new Chart(el,cfg); };
const fillG = ctx => { const c=ctx.chart; if(!c.chartArea) return 'transparent'; const g=c.ctx.createLinearGradient(0,c.chartArea.top,0,c.chartArea.bottom); g.addColorStop(0,'rgba(79,140,255,.38)'); g.addColorStop(1,'rgba(79,140,255,0)'); return g; };

// ---------- DATA ----------
const now = new Date();
for (let y=now.getFullYear(); y>=now.getFullYear()-4; y--) $('fYr').add(new Option(y,y));
$('fYr').add(new Option('All years',''),0); $('fYr').value = now.getFullYear();
MON.forEach((m,i)=>$('fMo').add(new Option(m,i+1)));
const params = () => ({ company:$('fCo').value, year:$('fYr').value, month:$('fMo').value });
function prevParams(){ const p=params(); if(!p.year) return null; let y=+p.year,m=+p.month; if(m){ m--; if(!m){m=12;y--;} return {...p,year:y,month:m}; } return {...p,year:y-1}; }

async function fetchData(p){
  if (DEMO) return mock(p);
  const res = await fetch(`${API_BASE}/api/analytics/201?${new URLSearchParams(p)}`, { headers:{ Authorization:`Bearer ${await getToken()}` } });
  if (!res.ok) throw new Error(res.status===403 ? 'Your account is not allowed to view analytics.' : `Server returned ${res.status}.`);
  return res.json();
}
async function load(){
  S.err=null; $('view').innerHTML='<div class="sk"></div><div class="sk" style="min-height:300px"></div>';
  try {
    const pp = $('fCmp').checked ? prevParams() : null;
    [S.data,S.prev] = await Promise.all([fetchData(params()), pp ? fetchData(pp) : null]);
    S.at = new Date();
  } catch(e){ S.err = e.message; }
  show();
}

// ---------- RENDER ----------
const delta=(c,p,bad)=>{ if(p==null||!isFinite(p)) return ''; if(p===0) return c===0?'':'<span class="dl nu">new</span>'; const d=(c-p)/p*100,up=d>=0; if(Math.abs(d)<.05) return '<span class="dl nu">no change</span>';
  const good=bad?!up:up; return `<span class="dl ${good?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(1)}% vs prev</span>`; };
const periodText=()=>{ const p=params(); return `${p.company==='all'?'All companies':p.company} · ${p.month?MON[p.month-1]+' ':''}${p.year||'All years'}`; };
const ring=(pct)=>`<div class="ring"><svg width="170" height="170" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#1f2d5c" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pct*3.1416}  314.16" transform="rotate(-90 60 60)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#35d8a4"/><stop offset="1" stop-color="#38d4ff"/></linearGradient></defs></svg><b>${pct}%</b><em>on time</em></div>`;
const kpi=(l,v,d,col)=>`<div class="card"><h3>${l}</h3><div class="n" data-n="${v}" ${col?`style="color:${col}"`:''}>0</div>${d}</div>`;
const mini=(rows,v)=>`<div class="mini">${rows.slice(0,5).map(r=>`<div><span>${esc(r.label)}</span><b>${r.count}</b></div>`).join('')||'<div><span style="color:var(--mu)">No data</span></div>'}</div><a href="#/${v}" style="color:var(--cy);font-weight:700;display:inline-block;margin-top:8px">View all</a>`;
const lateTbl=(rows)=>`<table><thead><tr><th>Company</th><th>Client</th><th>Position</th><th>Started</th><th>Submitted</th><th class="r">Late by</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.company)}</td><td>${esc(r.client)}</td><td>${esc(r.position)}</td><td>${esc(r.start)}</td><td>${esc(r.submitted)}</td><td class="r" style="color:var(--rd);font-weight:700">${r.hoursLate}h</td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mu);text-align:center">No late submissions</td></tr>'}</tbody></table>`;

function trendCfg(rows,type){ return { type, data:{ labels:rows.map(r=>r.label), datasets:[{ data:rows.map(r=>r.count), borderColor:'#4f8cff', backgroundColor:type==='line'?fillG:'#4f8cff', fill:true, tension:.35, borderRadius:6, pointRadius:3, pointBackgroundColor:'#38d4ff' }] },
  options:{ maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,ticks:{precision:0}}, x:{grid:{display:false}} } } }; }
function pieCfg(rows){ return { type:'doughnut', data:{ labels:rows.map(r=>r.label), datasets:[{ data:rows.map(r=>r.count), backgroundColor:PAL, borderWidth:0 }] }, options:{ maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom',labels:{boxWidth:10,usePointStyle:true}}} } }; }
function barCfg(rows,vert){ const r=rows.slice(0,10); return { type:'bar', data:{ labels:r.map(x=>x.label), datasets:[{ data:r.map(x=>x.count), backgroundColor:'#4f8cff', borderRadius:6 }] }, options:{ indexAxis:vert?'x':'y', maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{display:!!vert?false:true},ticks:{precision:0}}, y:{grid:{display:false},ticks:{precision:0}} } } }; }
const toggle=(opts,cur)=>`<div class="tab">${opts.map(o=>`<button data-ct="${o[0]}" class="${o[0]===cur?'on':''}">${o[1]}</button>`).join('')}</div>`;

function rowsOf(v){ let rows=[...S.data[V[v].k]]; const tot=rows.reduce((a,r)=>a+r.count,0)||1; rows=rows.map(r=>({...r,share:r.count/tot*100}));
  if(S.q) rows=rows.filter(r=>r.label.toLowerCase().includes(S.q.toLowerCase())); const [k,d]=S.sort; return rows.sort((a,b)=>(k==='label'?a.label.localeCompare(b.label):a[k]-b[k])*d); }

function viewHtml(v){
  const D=S.data,P=S.prev,K=D.kpi,PK=P&&P.kpi;
  if(v==='overview') return `
   <div class="g hero"><div class="card"><h3>Compliance</h3>${ring(K.onTimeRate)}</div>
    <div class="kp">${kpi('Total submissions',K.total,delta(K.total,PK?.total))}${kpi('On time',K.onTime,delta(K.onTime,PK?.onTime),'var(--gr)')}${kpi('Late',K.late,delta(K.late,PK?.late,1),'var(--rd)')}${kpi('Avg. hours to submit',K.avgLagHours,delta(K.avgLagHours,PK?.avgLagHours,1))}</div></div>
   <div class="g c21"><div class="card"><h3>Submissions trend <span id="tg"></span></h3><div class="ch-box"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3>Per company</h3><div class="ch-box"><canvas id="c2"></canvas></div></div></div>
   <div class="g c3"><div class="card"><h3>Top clients</h3>${mini(D.perClient,'client')}</div><div class="card"><h3>Top positions</h3>${mini(D.perPosition,'position')}</div><div class="card"><h3>Top regions</h3>${mini(D.perRegion,'region')}</div></div>
   <div class="card"><h3>Longest overdue <a href="#/compliance" style="color:var(--cy)">Open compliance</a></h3>${lateTbl(D.lateList.slice(0,5))}</div>`;
  if(v==='compliance'){ const p=params(),y=+p.year||now.getFullYear(),m=+p.month||(now.getMonth()+1),map=Object.fromEntries(D.calendar.map(c=>[c.date,c])),f=new Date(y,m-1,1).getDay(),dn=new Date(y,m,0).getDate();
    let h=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(f);
    for(let d=1;d<=dn;d++){ const c=map[`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`]; h+=`<div class="d" ${c&&c.late?'style="border-color:rgba(255,107,129,.5)"':''}><b>${d}</b>${c?`<div class="ok">${c.onTime} on time</div>${c.late?`<div class="lt">${c.late} late</div>`:''}`:''}</div>`; }
    return `<div class="g hero"><div class="card"><h3>On-time rate</h3>${ring(K.onTimeRate)}</div><div class="kp" style="grid-template-columns:repeat(3,1fr)">${kpi('On time',K.onTime,delta(K.onTime,PK?.onTime),'var(--gr)')}${kpi('Late',K.late,delta(K.late,PK?.late,1),'var(--rd)')}${kpi('Avg. hours to submit',K.avgLagHours,delta(K.avgLagHours,PK?.avgLagHours,1))}</div></div>
     <div class="card" style="margin-bottom:14px"><h3>Submission calendar · ${MON[m-1]} ${y} <span class="pill">Late = over ${K.lateHours}h after start</span></h3><div class="cal">${h}</div></div>
     <div class="card"><h3>Longest overdue</h3>${lateTbl(D.lateList)}</div>`; }
  const c=V[v], rows=rowsOf(v), ct=S.ct||(c.trend?'line':c.ty||'bar'), mx=Math.max(1,...rows.map(r=>r.count)), shown=rows.slice(0,S.lim);
  const th=(k,l,r)=>`<th data-s="${k}" class="${r?'r':''}">${l}${S.sort[0]===k?(S.sort[1]<0?' ▼':' ▲'):''}</th>`;
  return `<div class="card" style="margin-bottom:14px"><h3>${c.t} <span id="tg"></span></h3><div class="ch-box"><canvas id="c1"></canvas></div></div>
   <div class="card"><h3>${rows.length} ${rows.length===1?'row':'rows'} <input type="search" id="q" placeholder="Search ${c.l.toLowerCase()}…" value="${esc(S.q)}" style="min-width:220px"></h3>
   <table><thead><tr>${th('label',c.l)}${th('count','Submissions',1)}${th('share','Share')}</tr></thead><tbody>${shown.map(r=>`<tr><td>${esc(r.label)}</td><td class="r"><b>${r.count}</b></td><td><div style="display:flex;gap:8px;align-items:center"><div class="mt" style="flex:1"><i style="width:${r.count/mx*100}%"></i></div><span style="color:var(--mu);width:46px">${r.share.toFixed(1)}%</span></div></td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:var(--mu)">No matching data</td></tr>'}</tbody></table>
   ${rows.length>S.lim?`<button class="btn" id="more" style="margin-top:12px">Show ${Math.min(15,rows.length-S.lim)} more</button>`:''}</div>`;
}

function afterDraw(v){
  document.querySelectorAll('[data-n]').forEach(el=>{ const t=+el.dataset.n,s=performance.now(),run=n=>{ const k=Math.min(1,(n-s)/700); el.textContent=Math.round(t*(1-Math.pow(1-k,3))).toLocaleString(); if(k<1) requestAnimationFrame(run); }; matchMedia('(prefers-reduced-motion:reduce)').matches?el.textContent=t.toLocaleString():requestAnimationFrame(run); });
  const D=S.data;
  if(v==='overview'){ const ct=S.ct||'line'; $('tg').innerHTML=toggle([['line','Line'],['bar','Bars']],ct); draw('c1',trendCfg(D.perMonth,ct)); draw('c2',pieCfg(D.perCompany)); }
  else if(v!=='compliance'){ const c=V[v],rows=S.data[c.k],ct=S.ct||(c.trend?'line':c.ty||'bar');
    $('tg').innerHTML=toggle(c.trend?[['line','Line'],['bar','Bars']]:[['bar','Bars'],['doughnut','Donut']],ct);
    draw('c1',ct==='doughnut'?pieCfg(rows):c.trend?trendCfg(rows,ct):barCfg(rows,c.vert)); }
}

function show(){
  const v=(location.hash.replace('#/','')||'overview'); const key=V[v]?v:'overview';
  $('ttl').textContent=V[key].t; $('sub').textContent=periodText()+(S.at?` · updated ${S.at.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`:'')+(DEMO?' · sample data':'');
  document.querySelectorAll('.nv[data-v]').forEach(b=>{ b.classList.toggle('on',b.dataset.v===key); if(b.dataset.v===key) b.closest('.grp')?.classList.add('open'); });
  if(S.err){ $('view').innerHTML=`<div class="card msg"><h2>Couldn't load analytics</h2><p>${esc(S.err)}</p><button class="btn pri" id="retry">Try again</button></div>`; $('retry').onclick=load; return; }
  if(!S.data) return;
  $('view').innerHTML=viewHtml(key); afterDraw(key);
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ S.ct=b.dataset.ct; show(); });
  document.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{ const k=t.dataset.s; S.sort=[k,S.sort[0]===k?-S.sort[1]:(k==='label'?1:-1)]; show(); });
  const q=$('q'); if(q) q.oninput=()=>{ S.q=q.value; S.lim=15; const p=q.selectionStart; show(); const n=$('q'); n.focus(); n.setSelectionRange(p,p); };
  const mo=$('more'); if(mo) mo.onclick=()=>{ S.lim+=15; show(); };
}

  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`gm-${v}-${params().year||'all'}.csv`; a.click(); };
setInterval(()=>{ if(!document.hidden && !S.err) load(); }, 300000);   // auto-refresh every 5 minutes

// ---------- SAMPLE DATA (?demo) ----------
function mock(p){ const R=n=>Math.floor(Math.random()*n), y=+p.year||now.getFullYear(), m=+p.month||0, pad=n=>String(n).padStart(2,'0');
  const split=(L,T)=>{ const w=L.map(()=>1+Math.random()*5),s=w.reduce((a,b)=>a+b); let r=T; return L.map((l,i)=>{ const c=i===L.length-1?r:Math.min(r,Math.round(T*w[i]/s)); r-=c; return {label:l,count:c}; }).sort((a,b)=>b.count-a.count); };
  const T=(m?40:380)+R(m?50:260), late=Math.round(T*(.08+Math.random()*.1)), cm=m||(now.getMonth()+1), dn=new Date(y,cm,0).getDate();
  const months=m?[`${y}-${pad(m)}`]:MON.map((_,i)=>`${y}-${pad(i+1)}`), pay=months.flatMap(x=>[`${x} 1st (1-15)`,`${x} 2nd (16-end)`]);
  const asc=a=>a.sort((a,b)=>a.label.localeCompare(b.label));
  return new Promise(ok=>setTimeout(()=>ok({ kpi:{total:T,onTime:T-late,late,onTimeRate:Math.round((T-late)/T*1000)/10,avgLagHours:30+R(40),lateHours:72},
   perMonth:asc(split(months,T)), perYear:asc(split([y-2,y-1,y].map(String),T)), perPayroll:asc(split(pay,T)),
   perCompany:split(['Prestige','Regcris','Tmarks','CoMerch'],T), perClient:split(['BACH','COFO','JER','JERO','MRCOP','REBIP','SUSAP','SUSIP'],T),
   perRegion:split(['NCR','Region IV-A','Region III','Region VII','Region XI','CAR'],T), perProvince:split(['Metro Manila','Cavite','Laguna','Bulacan','Cebu','Davao del Sur','Pampanga','Batangas'],T),
   perCity:split(['Quezon City','Makati','Taguig','Cebu City','Davao City','Pasig','Imus','Calamba'],T), perPosition:split(['Sales Associate','Merchandiser','Promodiser','Cashier','Team Leader','Warehouse Staff','Encoder'],T),
   perGender:split(['Female','Male'],T), perAge:asc(split(['18-24','25-34','35-44','45-54','55+'],T)),
   calendar:Array.from({length:dn},(_,i)=>({date:`${y}-${pad(cm)}-${pad(i+1)}`,onTime:R(9),late:R(4)===0?1+R(2):0})),
   lateList:Array.from({length:Math.min(late,10)},(_,i)=>({company:['Prestige','Regcris','Tmarks','CoMerch'][R(4)],client:['BACH','COFO','JER','SUSAP'][R(4)],position:['Merchandiser','Cashier','Promodiser','Team Leader'][R(4)],start:`${y}-${pad(cm)}-0${1+R(8)}`,submitted:`${y}-${pad(cm)}-${10+R(15)}`,hoursLate:96-i*7+R(5)})) }),350)); }

guard('manager', () => load());   // only managers get in; data loads after the role check
