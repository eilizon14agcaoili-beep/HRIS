<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> | HRIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/dashboard.css">
  <style>
/* red and white theme */
body[data-role="staff"]{--bg:#fff;--surface:#fff;--ink:#2a1215;--muted:#7a5b5f;--line:#f0d4d6;--accent:#b91c1c;--accent-ink:#fff;--err:#b42318;--ok:#067647;--warn:#9a6700;background:linear-gradient(180deg,#fff 0%,#fdeaea 100%) fixed}
main{max-width:1100px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 28px;border-radius:16px;color:#fff;background:linear-gradient(120deg,#7f1d1d 0%,#b91c1c 55%,#ef4444 100%)}
.brandbox{display:flex;align-items:center;gap:16px}
.logo{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800}
.banner h1{margin:0;font-size:1.3rem;letter-spacing:.04em}
.banner .who{color:#fff}
.banner .who button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.45)}
.sec{margin:32px 0 2px;font-size:1.2rem;letter-spacing:.03em;color:#991b1b}
.secsub{margin:0 0 16px;color:var(--muted);font-size:.9rem}

/* ===== Application cards ===== */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.app{
  --mx:50%;--my:50%;
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;gap:20px;
  min-height:160px;width:100%;padding:18px;
  border:1px solid var(--line);border-radius:16px;background:var(--surface);
  text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;
  animation:cardIn .6s cubic-bezier(.2,.8,.2,1) backwards;
  animation-delay:calc(var(--i) * 70ms);
}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.96)}}
.app::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx) var(--my),rgba(239,68,68,.16),transparent 70%)}
.app::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#7f1d1d,#ef4444);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.app:hover,.app:focus-visible{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 14px 30px rgba(185,28,28,.18);outline:none}
.app:hover::before,.app:focus-visible::before{opacity:1}
.app:hover::after,.app:focus-visible::after{transform:scaleX(1)}
.app:active{transform:translateY(-2px) scale(.98)}
.app .top{display:flex;gap:12px;align-items:flex-start}
.app .ico{flex:none;width:42px;height:42px;border-radius:12px;background:#fee2e2;color:var(--accent);display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .25s,color .25s}
.app:hover .ico,.app:focus-visible .ico{transform:rotate(-8deg) scale(1.12);background:var(--accent);color:#fff}
.app .n{font-size:.66rem;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.app strong{display:block;margin-top:2px;font-size:1rem;line-height:1.3}
.app .go{display:flex;align-items:center;gap:8px;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.app .go i{font-style:normal;transition:transform .25s}
.app:hover .go i{transform:translateX(6px)}
.app .live{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%,100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}

/* coming soon cards */
.app.soon{background:rgba(255,255,255,.6)}
.app.soon .ico{background:#f5eaea;color:#b9a3a6}
.app.soon:hover,.app.soon:focus-visible{border-color:var(--line);box-shadow:0 8px 18px rgba(0,0,0,.06);transform:translateY(-3px)}
.app.soon:hover .ico,.app.soon:focus-visible .ico{background:#f5eaea;color:#b9a3a6;transform:rotate(8deg)}
.app.soon::after,.app.soon::before{display:none}
.app.soon .n,.app.soon strong{opacity:.75}
.app.soon .go{color:var(--muted)}
.app.soon.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;z-index:99;padding:12px 20px;border-radius:999px;background:#2a1215;color:#fff;font-weight:600;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}

/* shared text helpers */
.sub{color:var(--muted);font-size:.8rem}
.warn{color:var(--warn);font-weight:600}.ok{color:var(--ok)}.err{color:var(--err)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{padding:6px 12px;font-size:.85rem;white-space:nowrap}
.st{font-size:.85rem;min-height:1.2em;margin-top:8px;color:var(--muted)}
.st.ok{color:var(--ok)}.st.err{color:var(--err)}
.missing{margin:14px 0 0;font-size:.9rem;font-weight:600;color:var(--warn)}.missing.done{color:var(--ok)}
dialog{width:calc(100% - 32px);max-width:680px;max-height:90vh;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(40,10,12,.55)}
.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.actions button.primary{width:auto;margin:0;padding:9px 16px}
@media(max-width:900px){.apps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.apps{grid-template-columns:1fr}}

/* Status pill (used in the review step) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pending{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.pill.complete{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}

/* ===== Add 201 pop-up ===== */
#dlg,#dlg:focus,#dlg:focus-visible{outline:none}
#dlg{width:calc(100% - 32px);max-width:720px;max-height:92vh;padding:0;border:0;border-radius:18px;background:#fff;color:#2a1215;box-shadow:0 24px 60px rgba(60,8,10,.35);overflow:hidden}
#dlg::backdrop{background:rgba(40,10,12,.55)}
#dlg form{max-height:92vh;overflow-y:auto;padding:0 30px 26px;display:grid;gap:4px}
.dlg-head{position:sticky;top:0;z-index:2;margin:0 -30px 8px;padding:20px 30px 16px;color:#fff;background:linear-gradient(120deg,#7f1d1d 0%,#b91c1c 55%,#ef4444 100%)}
#dlg h2{margin:0 0 14px;font-size:1.25rem;letter-spacing:.03em;color:#fff}

.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.steps li{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.7)}
.steps .num{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);font-size:.75rem;color:#fff}
.steps .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.on{color:#fff}
.steps li.on .num,.steps li.done .num{background:#fff;color:#b91c1c}
.bar{height:4px;margin-top:12px;border-radius:4px;background:rgba(255,255,255,.28)}
.bar i{display:block;height:100%;width:25%;border-radius:4px;background:#fff;transition:width .25s}

#dlg [hidden]{display:none!important}
#dlg .step{display:grid;gap:4px}
#dlg .review{margin-top:6px;padding:16px 18px;border:1px solid #f0d4d6;border-radius:14px;background:#fff7f7}
#dlg .rv-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#dlg .rv-name{font-weight:800;font-size:1.1rem;color:#2a1215}
#dlg .rv-dl{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:14px 0 4px}
#dlg .rv-dl dt{color:#7a5b5f;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
#dlg .rv-dl dd{margin:0;word-break:break-word}
#dlg .rv-h{margin:16px 0 10px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#991b1b}
#dlg .pvlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;list-style:none;margin:0;padding:0}
#dlg .pv{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid #f0d4d6;border-radius:12px;background:#fff;min-width:0}
#dlg .pv.miss{border-style:dashed;background:transparent}
#dlg .thumb{flex:none;display:grid;place-items:center;width:60px;height:60px;border-radius:8px;overflow:hidden;background:#fdeaea;color:#b9a3a6;font-weight:800;text-decoration:none}
#dlg .thumb img{width:100%;height:100%;object-fit:cover;display:block}
#dlg .thumb .pdf{color:#b91c1c;font-size:.8rem;letter-spacing:.06em}
#dlg .pv-info{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.88rem}
#dlg .pv-info .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dlg .pill.complete{background:#dcfce7;color:#166534;border:1px solid #86efac}
#dlg #cancelBtn{margin-right:auto}
#dlg label{display:block;margin:12px 0 5px;font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a5b5f}
#dlg input:not([type=file]),#dlg textarea{width:100%;box-sizing:border-box;padding:11px 14px;font:inherit;color:#2a1215;background:#fff;border:1px solid #f0d4d6;border-radius:10px;outline:none;transition:border-color .15s, box-shadow .15s}
#dlg input::placeholder,#dlg textarea::placeholder{color:#b9a3a6}
#dlg input:not([type=file]):focus,#dlg textarea:focus{border-color:#b91c1c;box-shadow:0 0 0 3px rgba(185,28,28,.15)}
#dlg textarea{min-height:84px;resize:vertical}
#dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#dlg fieldset{margin:16px 0 4px;padding:14px 18px 8px;border:1px solid #f0d4d6;border-radius:14px;background:#fff7f7}
#dlg legend{padding:0 10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:#991b1b}
#dlg .hint{margin:0 0 4px;font-size:.82rem;color:#7a5b5f}
#dlg .st{margin:4px 0 0;font-size:.8rem;color:var(--muted)}
#dlg .st.ok{color:var(--ok)}
#dlg .st.err,#dlg .msg.err{color:var(--err);font-weight:600}
#dlg .msg.ok{color:var(--ok)}
#dlg .missing{margin:14px 0 0;color:var(--warn)}
#dlg .missing.done{color:var(--ok)}
#dlg .actions{margin-top:18px;gap:12px}
#dlg .actions button{padding:11px 22px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid #f0d4d6;background:#fff;color:#7a5b5f;transition:background .15s}
#dlg .actions button:hover{background:#fdeaea}
#dlg .actions button.primary{width:auto;background:linear-gradient(120deg,#ef4444,#b91c1c);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(185,28,28,.3)}
#dlg .actions button.primary:hover{filter:brightness(1.08)}
#dlg .actions button:disabled{opacity:.6;cursor:not-allowed}
#dlg form::-webkit-scrollbar{width:8px}
#dlg form::-webkit-scrollbar-thumb{background:#e8b4b8;border-radius:8px}

@media(max-width:520px){
  #dlg .row{grid-template-columns:1fr}
  #dlg form{padding:0 18px 20px}
  .dlg-head{margin:0 -18px 8px;padding:16px 18px 14px}
  #dlg .pvlist{grid-template-columns:1fr}
}
#dlg select{width:100%;box-sizing:border-box;padding:11px 14px;font:inherit;color:#2a1215;background:#fff;border:1px solid #f0d4d6;border-radius:10px}
#dlg select:focus{border-color:#b91c1c;box-shadow:0 0 0 3px rgba(185,28,28,.15);outline:none}
#dlg select:disabled,#dlg input:read-only{background:#f7eeee;color:#7a5b5f}
#dlg .step h3{margin:6px 0 0;font-size:1rem;color:#991b1b}
#dlg .slot{margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed #f0d4d6}
#dlg .slot:last-child{border:0}
#dlg .slot .btns{margin-top:2px}
#dlg .slot button{padding:8px 14px;border-radius:10px;border:1px solid #e8b4b8;background:#fff;color:#b91c1c;font-weight:700;cursor:pointer}
#dlg .slot button:hover{background:#fdeaea}
.steps .lbl{display:none}.steps li.on .lbl{display:inline}
#dlg .sigprev{display:block;max-width:240px;max-height:90px;margin-top:8px;border:1px solid #f0d4d6;border-radius:8px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.sigcv{display:block;width:100%;height:auto;aspect-ratio:3/1;border:1px solid #e8b4b8;border-radius:10px;background:linear-gradient(to bottom,transparent calc(100% - 40px),#d9c4c6 calc(100% - 40px),#d9c4c6 calc(100% - 39px),transparent calc(100% - 39px)),#fff;touch-action:none;cursor:crosshair}

/* ===== FORM + BUTTON ANIMATIONS ===== */
dialog[open]{animation:dlgIn .38s cubic-bezier(.2,.9,.3,1.15)}
dialog[open]::backdrop{animation:fadeIn .3s both;backdrop-filter:blur(3px)}
dialog.closing{animation:dlgOut .2s ease forwards}
dialog.closing::backdrop{animation:fadeOut .2s forwards}
@keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}

#dlg .step.in-fwd{--dx:26px}
#dlg .step.in-back{--dx:-26px}
#dlg .step.in-fwd>*,#dlg .step.in-back>*{animation:fieldIn .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 45ms)}
@keyframes fieldIn{from{opacity:0;transform:translateX(var(--dx,0px)) translateY(10px)}}

.bar i{position:relative;overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(239,68,68,.55),transparent);transform:translateX(-100%);animation:shimmer 1.8s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.steps .num{transition:background .25s,color .25s}
.steps li.on .num{animation:ring 1.8s infinite}
.steps li.done .num{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%,100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}

#dlg label{transition:color .2s}
#dlg div:focus-within>label{color:#b91c1c}
#dlg input:not([type=file]),#dlg textarea,#dlg select{transition:border-color .2s,box-shadow .2s,transform .2s,background .2s}
#dlg input:not([type=file]):focus,#dlg textarea:focus,#dlg select:focus{transform:translateY(-1px)}
#dlg input:not([type=file]):not(:focus):not(:placeholder-shown):valid{border-color:#86efac}
.shake-x{animation:shakeX .4s}
@keyframes shakeX{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

#dlg .st.ok{animation:pop .35s cubic-bezier(.3,1.6,.5,1);transform-origin:left}
#dlg .st.err{animation:shakeX .4s}
#dlg .sigprev:not([hidden]){animation:fadeIn .4s}
#dlg .slot button{transition:background .2s,transform .2s,box-shadow .2s}
#dlg .slot button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(185,28,28,.15)}
#dlg .review{animation:fadeIn .4s}
#dlg .rv-h,#dlg .pv{animation:fieldIn .4s cubic-bezier(.2,.8,.2,1) backwards}
#dlg .pv:nth-child(1){animation-delay:.05s}#dlg .pv:nth-child(2){animation-delay:.1s}#dlg .pv:nth-child(3){animation-delay:.15s}#dlg .pv:nth-child(4){animation-delay:.2s}
#dlg .pv:nth-child(5){animation-delay:.25s}#dlg .pv:nth-child(6){animation-delay:.3s}#dlg .pv:nth-child(7){animation-delay:.35s}#dlg .pv:nth-child(8){animation-delay:.4s}
#dlg .pv{transition:transform .2s,box-shadow .2s}
#dlg .pv:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(185,28,28,.12)}

/* buttons: lift, shine, press, ripple */
#dlg button{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,filter .2s}
#dlg .actions button:hover{transform:translateY(-2px)}
#dlg button:active{transform:translateY(0) scale(.96)}
#dlg .actions button.primary::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
#dlg .actions button.primary:hover::after{left:130%}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
#nextBtn{animation:nudge 2.4s ease-in-out infinite}
#nextBtn:hover{animation:none}
@keyframes nudge{0%,88%,100%{transform:translateX(0)}94%{transform:translateX(4px)}}

/* SUBMIT button states: loading spinner, success check */
button.primary.loading,button.primary.success{pointer-events:none}
#dlg button.primary.loading,#dlg button.primary.success{color:transparent;opacity:1}
#dlg button.primary.loading:disabled{opacity:1}
button.primary.loading::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#dlg button.primary.success{background:linear-gradient(120deg,#22c55e,#15803d);box-shadow:0 6px 16px rgba(21,128,61,.4);animation:successPulse .6s}
button.primary.success::before{content:"\2713";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:1.3rem;font-weight:800;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes successPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 18px rgba(34,197,94,0)}}

@media (prefers-reduced-motion:reduce){
  .app,.app .live{animation:none!important}
  .app,.app *{transition:none!important}
  dialog,dialog::backdrop,#dlg .step>*,#dlg .pv,#dlg .rv-h,#dlg .st,.steps .num,.bar i::after,#nextBtn{animation:none!important}
  #dlg *{transition:none!important}
}
  </style>
</head>

<body data-role="staff">
  <main>
    <div class="banner">
      <div class="brandbox">
        <div class="logo">HR</div>
        <div>
          <h1 id="pageTitle">HR CONNECT SUBMISSION</h1>
        </div>
      </div>
      <div class="who">
        <span>Welcome, <strong id="welcomeName"></strong></span>
        <span id="userName" hidden></span>
        <button id="logoutBtn" type="button">Log out</button>
      </div>
    </div>

    <!-- Home: applications -->
    <h2 class="sec">HR CONNECT SUBMISSION</h2>
    <p class="secsub">Human Resources Applications &amp; Digital Services</p>
    <div class="apps" id="apps"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="camIn" accept="image/*" capture hidden>
  <input type="file" id="upIn" accept=".pdf,.jpg,.jpeg,.png" hidden>

  <!-- Add 201 pop-up (9 steps) -->
  <dialog id="dlg" aria-labelledby="dlgTitle">
    <form id="reqForm" novalidate>
      <div class="dlg-head">
        <h2 id="dlgTitle">New 201 file</h2>
        <ol class="steps" id="steps" aria-label="Form steps"></ol>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <div id="stepsBox"></div>
      <div class="actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="button" id="prevBtn" hidden>Back</button>
        <button type="button" class="primary" id="nextBtn">Next</button>
        <button class="primary" id="saveBtn" type="submit" hidden>Submit</button>
      </div>
    </form>
  </dialog>

  <script type="module">
import { guard, auth } from "../shared/guard.js";
import { API_URL } from "../shared/firebase-config.js";

/* ---------- Client / Department data (by Company) ---------- */
// Prestige, Regcris and Tmarks are filled in. Add CoMerch here when you have its list.
const CLIENTS = {
  Prestige: [
    ["BACH",  "BACH - Bayer Philippines Inc."],
    ["COFO",  "COFO - Commonwealth Foods, Inc."],
    ["JER",   "JER - Jeron Distribution Group Inc."],
    ["JERO",  "JERO - Jeron Distribution Group Inc."],
    ["MRCOP", "MRCOP - Multirich Foods Corporation"],
    ["REBIP", "REBIP - Republic Biscuit Corporation"],
    ["SUSAP", "SUSAP - Suncrest Foods Incorporated"],
    ["SUSIP", "SUSIP - Suncrest Foods Incorporated"]
  ],
  Regcris: [
    ["MGEN", "MGEN - 2 Way Synergy (Mega-Epi)"],
    ["EVER", "EVER - Energizer Philippines Inc"],
    ["BMEG", "BMEG - Mega Fishing Corporation"],
    ["MRCO", "MRCO - Multirich Foods Corporation"],
    ["MFIC", "MFIC - Multirich Foods Incorporated"],
    ["RNUT", "RNUT - Nutritive Snack Food Corp."],

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const token = await auth.currentUser.getIdToken();
  let res;
  try {
    res = await fetch(API_URL + path, { ...opts, headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  } catch {
    throw new Error("Cannot reach the server. Is the back-end running? (npm start in BACK-END)");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

}

/* ---------- Blur check (images) ---------- */
async function checkImage(file) {
  if (file.size > 10 * 1024 * 1024) return { ok: false, reason: "File is over 10 MB." };
  if (!file.type.startsWith("image/")) return { ok: true };
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { return { ok: false, reason: "Cannot read this image. Use JPG or PNG." }; }
  if (Math.min(bmp.width, bmp.height) < MIN_SIDE) return { ok: false, reason: "Resolution is too low. Retake the photo closer." };
  const scale = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  for (let i = 0; i < g.length; i++) g[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
  let sum = 0, sumSq = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const lap = g[i - w] + g[i + w] + g[i - 1] + g[i + 1] - 4 * g[i];
    sum += lap; sumSq += lap * lap; n++;
  }
  const variance = sumSq / n - (sum / n) ** 2;
  console.log("Sharpness score:", Math.round(variance), "(needs", BLUR_THRESHOLD + ")");
  return variance >= BLUR_THRESHOLD ? { ok: true } : { ok: false, reason: "Too blurry. Please retake the photo." };
}

/* ---------- E-signature: remove the paper background, crop, shrink ---------- */
async function cleanSignature(file) {
  if (file.size > 10 * 1024 * 1024) throw new Error("File is over 10 MB.");
  if (!file.type.startsWith("image/")) return file;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error("Cannot read this image. Try JPG or PNG."); }
  const sc = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * sc)), h = Math.max(1, Math.round(bmp.height * sc));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(bmp, 0, 0, w, h);
  const img = cx.getImageData(0, 0, w, h), d = img.data, n = w * h;
  const lum = new Float32Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) { const l = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; lum[i] = l; hist[l | 0]++; }
  let acc = 0, paper = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.9) { paper = v; break; } }
  const hi = paper * 0.9, lo = paper * 0.5;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, a = Math.min(1, Math.max(0, (hi - lum[i]) / (hi - lo)));
    d[i * 4] *= 0.6; d[i * 4 + 1] *= 0.6; d[i * 4 + 2] *= 0.6; d[i * 4 + 3] = Math.round(a * 255);
    if (a > 0.3) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) throw new Error("No signature found. Use dark ink on blank white paper.");
  cx.putImageData(img, 0, 0);
  const pad = 8; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1, k = Math.min(1, 600 / cw, 200 / ch);
  const out = document.createElement("canvas"); out.width = Math.max(1, Math.round(cw * k)); out.height = Math.max(1, Math.round(ch * k));
  out.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, out.width, out.height);
  const blob = await new Promise((res) => out.toBlob(res, "image/png"));
  return new File([blob], "e-signature.png", { type: "image/png" });
}

const PSGC = "https://psgc.gitlab.io/api";
const geoCache = {};
async function geo(path) {
  if (!geoCache[path]) {
    const r = await fetch(PSGC + path);
    if (!r.ok) throw new Error("Cannot load locations. Check your internet connection.");
    const data = await r.json();
    geoCache[path] = data.sort((a, b) => a.name.localeCompare(b.name));
  }
  return geoCache[path];
}
function fillGeo(sel, list, ph = "-- Select --") {
  sel.innerHTML = `<option value="">${ph}</option>` +
    list.map((x) => `<option value="${esc(x.label || x.name)}" data-code="${esc(x.code)}">${esc(x.label || x.name)}</option>`).join("");
  sel.disabled = !list.length;
}
const geoCode = (sel) => sel.selectedOptions[0]?.dataset.code || "";
const clearGeo = (...ids) => ids.forEach((id) => fillGeo($("f_" + id), []));
const geoLoading = (id) => { const s = $("f_" + id); s.innerHTML = `<option value="">Loading...</option>`; s.disabled = true; };
const geoFail = (e) => { toast(e.message || "Cannot load locations."); };

$("f_workArea").addEventListener("change", async (e) => {
  clearGeo("region", "province", "city");
  if (!e.target.value) return;
  geoLoading("region");
  try {
    const all = await geo("/regions/");
    const list = all.filter((r) => String(r.islandGroupCode || "").toLowerCase() === e.target.value.toLowerCase())
      .map((r) => ({ code: r.code, name: r.name, label: r.regionName ? `${r.regionName} – ${r.name}` : r.name }));
    fillGeo($("f_region"), list);
  } catch (err) { clearGeo("region"); geoFail(err); }
});

$("f_region").addEventListener("change", async (e) => {
  clearGeo("province", "city");
  const c = geoCode(e.target);
  if (!c) return;
  geoLoading("province");
  try {
    const provs = await geo(`/regions/${c}/provinces/`);
    if (provs.length) { fillGeo($("f_province"), provs); return; }
    // No provinces (e.g. NCR): skip province, load cities directly from the region
    const p = $("f_province");
    p.innerHTML = `<option value="N/A" selected>N/A (no province)</option>`; p.disabled = true;
    geoLoading("city");
    fillGeo($("f_city"), await geo(`/regions/${c}/cities-municipalities/`));
  } catch (err) { clearGeo("province", "city"); geoFail(err); }
});

$("f_province").addEventListener("change", async (e) => {
  clearGeo("city");
  const c = geoCode(e.target);
  if (!c) return;
  geoLoading("city");
  try { fillGeo($("f_city"), await geo(`/provinces/${c}/cities-municipalities/`)); }
  catch (err) { clearGeo("city"); geoFail(err); }
});

/* number formats */
$("reqForm").addEventListener("input", (e) => {
  const g = NUMGRP[e.target.dataset.fmt];
  if (!g) return;
  const d = e.target.value.replace(/\D/g, "").slice(0, g.reduce((a, b) => a + b));
  const out = []; let p = 0;
  for (const n of g) { if (p >= d.length) break; out.push(d.slice(p, p + n)); p += n; }
  e.target.value = out.join("-");
});
$("f_prevWork").addEventListener("change", (e) => { $("w_prevDetails").hidden = e.target.value !== "Yes"; });

/* documents: take photo / upload */
let docs = {}, curSlot = null;
const docName = (k) => k === "__extra" ? ($("extraType").value ? "Additional: " + $("extraType").value : "") : k;
$("stepsBox").addEventListener("click", (e) => {
  if (e.target.closest("[data-clear]")) return sigClear();
  const b = e.target.closest("button[data-src]");
  if (!b) return;
  const slot = b.closest(".slot");
  curSlot = slot;
  const photo = slot.dataset.k === "2x2 ID Photo";
  const inp = b.dataset.src === "cam" ? $("camIn") : $("upIn");
  if (b.dataset.src === "cam") inp.setAttribute("capture", photo ? "user" : "environment");
  else inp.accept = slot.dataset.k === "E-Signature" ? "image/*,.pdf" : photo ? ".jpg,.jpeg,.png" : ACCEPT;
  inp.click();
});
async function onDoc(e) {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !curSlot) return;
  const slot = curSlot, k = slot.dataset.k, st = slot.querySelector(".st");
  st.className = "st"; st.textContent = "Checking...";
  let r, f = file;
  if (k === "E-Signature") { try { f = await cleanSignature(file); r = { ok: true }; } catch (err) { r = { ok: false, reason: err.message }; } }
  else r = await checkImage(file);
  if (!r.ok) { delete docs[k]; st.textContent = r.reason; st.className = "st err"; if (k === "E-Signature") showSigPrev(null); }
  else {
    docs[k] = f; st.className = "st ok";
    if (k === "E-Signature") { st.textContent = f !== file ? "✓ Background removed" : "✓ " + file.name; showSigPrev(f); }
    else st.textContent = "✓ " + file.name;
  }
  refreshMissing();
}
$("camIn").addEventListener("change", onDoc);
$("upIn").addEventListener("change", onDoc);

/* e-signature pad */
function makePad(cv, onEnd) {
  const c = cv.getContext("2d");
  const reset = () => { c.clearRect(0, 0, cv.width, cv.height); c.strokeStyle = "#111"; c.lineWidth = 3; c.lineCap = "round"; c.lineJoin = "round"; };
  reset();
  let drawing = false, inked = false;
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener("pointerdown", (e) => { drawing = inked = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); c.beginPath(); c.moveTo(x, y); c.lineTo(x + 0.1, y + 0.1); c.stroke(); });
  cv.addEventListener("pointermove", (e) => { if (!drawing) return; const [x, y] = pt(e); c.lineTo(x, y); c.stroke(); });
  const end = () => { if (!drawing) return; drawing = false; if (onEnd) onEnd(); };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  return {
    reset: () => { reset(); inked = false; },
    toFile: () => new Promise((res) => cv.toBlob((bl) => res(new File([bl], "e-signature.png", { type: "image/png" })), "image/png"))
  };
}
let sigPrevUrl = null;
function showSigPrev(f) {
  const el = $("sigPrev");
  if (sigPrevUrl) { URL.revokeObjectURL(sigPrevUrl); sigPrevUrl = null; }
  if (!f || !f.type.startsWith("image/")) { el.hidden = true; return; }
  sigPrevUrl = URL.createObjectURL(f); el.src = sigPrevUrl; el.hidden = false;
}
const formPad = makePad($("sigCv"), async () => {
  showSigPrev(null);
  docs["E-Signature"] = await formPad.toFile();
  const st = $("sigCv").closest(".slot").querySelector(".st"); st.textContent = "✓ Signature captured"; st.className = "st ok";
  refreshMissing();
});
function sigClear() {
  formPad.reset(); showSigPrev(null); delete docs["E-Signature"];
  const st = $("sigCv").closest(".slot").querySelector(".st"); st.textContent = ""; st.className = "st";
  refreshMissing();
}

/* steps */
let step = 0;
function stepValid(i, report = true) {
  const sec = document.querySelector(`#reqForm .step[data-step="${i}"]`);
  for (const el of sec.querySelectorAll("input[required],select[required]")) {
    if (el.disabled) continue;
    if (!el.checkValidity()) { if (report) { el.classList.remove("shake-x"); void el.offsetWidth; el.classList.add("shake-x"); el.reportValidity(); } return false; }
  }
  return true;
}
let previewUrls = [];
const freePreviews = () => { previewUrls.forEach((u) => URL.revokeObjectURL(u)); previewUrls = []; };
const val = (n) => ($("f_" + n)?.value || "").trim();
const missingNow = () => REQS.filter((k) => !docs[k]);

function renderReview() {
  freePreviews();
  const missing = missingNow(), done = !missing.length;
  const sections = SEC.map((s) => `<h3 class="rv-h">${esc(s.h)}</h3><dl class="rv-dl" style="grid-template-columns:170px 1fr">
    ${s.f.filter((f) => !f.hide || val(f.n)).map((f) => `<dt>${esc(f.l)}</dt><dd>${esc(val(f.n) || "—")}</dd>`).join("")}</dl>`).join("");
  const extra = docs.__extra ? [{ k: "__extra", n: docName("__extra") || "Additional (no type chosen)" }] : [];
  const list = [...DOCS.map((d) => ({ k: d.k, n: d.l })), ...extra].map(({ k, n }) => {
    const f = docs[k];
    if (!f) return `<li class="pv miss"><span class="thumb">—</span><div class="pv-info"><strong>${esc(n)}</strong><span class="warn">Missing</span></div></li>`;
    const url = URL.createObjectURL(f); previewUrls.push(url);
    const th = f.type.startsWith("image/") ? `<img src="${url}" alt="${esc(n)}">` : `<span class="pdf">PDF</span>`;
    return `<li class="pv"><a class="thumb" href="${url}" target="_blank" rel="noopener">${th}</a><div class="pv-info"><strong>${esc(n)}</strong><span class="sub">${esc(f.name)}</span></div></li>`;
  }).join("");
  $("review").innerHTML = `<div class="rv-top"><div class="rv-name">${esc([val("firstName"), val("middleName"), val("lastName"), val("suffix")].filter(Boolean).join(" "))}</div>
    <span class="pill ${done ? "complete" : "pending"}">${done ? "Complete" : "Pending"}</span></div>
    ${sections}<h3 class="rv-h">Documents · ${REQS.length - missing.length} of ${REQS.length} attached</h3><ul class="pvlist">${list}</ul>`;
}

function goTo(n) {
  const old = step;
  step = Math.max(0, Math.min(LAST, n));
  document.querySelectorAll("#reqForm .step").forEach((s) => { s.hidden = Number(s.dataset.step) !== step; s.classList.remove("in-fwd", "in-back"); });
  const cur = document.querySelector(`#reqForm .step[data-step="${step}"]`);
  [...cur.children].forEach((c, i) => c.style.setProperty("--d", Math.min(i, 10)));
  void cur.offsetWidth; cur.classList.add(step >= old ? "in-fwd" : "in-back");
  document.querySelectorAll("#steps li").forEach((li) => {
    const i = Number(li.dataset.i);
    li.classList.toggle("on", i === step); li.classList.toggle("done", i < step);
    li.querySelector(".num").textContent = i < step ? "✓" : String(i + 1);
  });
  $("bar").style.width = ((step + 1) / STEPS.length * 100) + "%";
  $("prevBtn").hidden = step === 0;
  $("nextBtn").hidden = step === LAST;
  $("saveBtn").hidden = step !== LAST;
  if (step === LAST) { refreshMissing(); renderReview(); }
  $("reqForm").scrollTop = 0;
}
$("nextBtn").addEventListener("click", () => { if (stepValid(step)) goTo(step + 1); });
$("prevBtn").addEventListener("click", () => goTo(step - 1));

let remarksEdited = false;
$("remarks").addEventListener("input", () => { remarksEdited = true; });
function refreshMissing() {
  const missing = missingNow(), el = $("missing");
  el.className = "missing" + (missing.length ? "" : " done");
  el.textContent = missing.length ? "Missing: " + missing.map((k) => DOCS.find((d) => d.k === k).l).join(", ") : "All requirements attached.";
  if (!remarksEdited) $("remarks").value = missing.length ? "Kulang: " + missing.join(", ") : "";
  return missing;
}

function resetForm() {
  remarksEdited = false; docs = {}; formPad.reset(); showSigPrev(null);
  $("reqForm").reset();
  fillSelect($("f_client"), []);
  fillSelect($("f_deptCode"), []);
  clearGeo("region", "province", "city");
  $("w_prevDetails").hidden = true;
  document.querySelectorAll("#reqForm .slot .st").forEach((s) => { s.textContent = ""; s.className = "st"; });
  say("formMsg", "");
  refreshMissing(); goTo(0);
}

/* Open the fill-up form (called by the 201 Submission card) */
let me = { name: "", email: "" };
function openForm() {
  resetForm();
  $("f_supervisorName").value = me.name; $("f_supervisorEmail").value = me.email;
  $("dlg").showModal();
}
$("cancelBtn").addEventListener("click", () => closeAnim($("dlg")));
$("dlg").addEventListener("close", freePreviews);

$("reqForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (step < LAST) { if (stepValid(step)) goTo(step + 1); return; }
  for (let i = 0; i < LAST; i++) if (i !== 7 && !stepValid(i, false)) { goTo(i); stepValid(i); return; }
  if (docs.__extra && !$("extraType").value) { goTo(7); say("formMsg", "Choose the type of the additional document.", "err"); return; }
  const missing = refreshMissing();
  if (missing.length && !$("remarks").value.trim()) { say("formMsg", "Add a remark about the missing files.", "err"); $("remarks").focus(); return; }
  const btn = $("saveBtn"); btn.disabled = true; btn.classList.add("loading"); say("formMsg", "Saving...");
  try {
    const body = Object.fromEntries(new FormData(e.target));
    body.fullName = [val("firstName"), val("middleName"), val("lastName"), val("suffix")].filter(Boolean).join(" ");
    body.email = body.empEmail; body.contactNumber = body.mobile; body.address = body.residence; body.department = val("deptCode");
    body.workArea = val("workArea"); body.region = val("region"); body.province = val("province"); body.cityMunicipality = val("city");
    body.supervisorMobile = val("supervisorMobile");
    const doc = await api("/api/requests", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const keys = Object.keys(docs), failed = [];
    for (let i = 0; i < keys.length; i++) {
      const name = docName(keys[i]);
      say("formMsg", `Uploading ${name} (${i + 1}/${keys.length})...`);
      try { await uploadFile(doc._id, name, docs[keys[i]]); } catch { failed.push(name); }
    }
    if (failed.length) say("formMsg", `Saved (Ref #${refOf(doc)}), but these files failed to upload: ${failed.join(", ")}.`, "err");
    else {
      btn.classList.remove("loading"); btn.classList.add("success");
      await new Promise((r) => setTimeout(r, 900));
      closeAnim($("dlg")); setTimeout(() => btn.classList.remove("success"), 300);
      toast(`201 submitted. Reference #${refOf(doc)}`);
    }
  } catch (err) { say("formMsg", err.message, "err"); }
  finally { btn.disabled = false; btn.classList.remove("loading"); }
});

goTo(0);

guard("staff", (user, name) => { me = { name, email: user.email }; });
  </script>
